<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 420" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Voice Input Bridge technical banner</title>
  <desc id="bannerDesc">PCM audio from devices is routed through a bridge to streaming ASR providers and then injected into Windows or macOS text fields.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08111f"/>
      <stop offset="0.55" stop-color="#102b3c"/>
      <stop offset="1" stop-color="#123b43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="420" rx="28" fill="url(#bg)"/>
  <path d="M0 330 C210 270 310 390 510 315 S860 240 1280 330 V420 H0Z" fill="#0a1928" opacity="0.72"/>
  <circle cx="1120" cy="76" r="160" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.18"/>
  <circle cx="1120" cy="76" r="120" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.18"/>
  <g fill="#5eead4" opacity="0.8">
    <rect x="72" y="62" width="8" height="8" rx="2"/>
    <rect x="90" y="62" width="8" height="8" rx="2"/>
    <rect x="108" y="62" width="8" height="8" rx="2"/>
  </g>
  <text x="72" y="142" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="2">VOICE INPUT BRIDGE</text>
  <text x="74" y="196" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="600">PCM in. Text out.</text>
  <text x="74" y="238" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="20">Device-agnostic dictation for Windows and macOS</text>
  <g transform="translate(74 292)">
    <rect width="142" height="52" rx="14" fill="#123246" stroke="#3b6273"/>
    <text x="71" y="32" text-anchor="middle" fill="#dff8f2" font-family="Segoe UI, Arial, sans-serif" font-size="17">ESP32 / M5Stick</text>
    <path d="M162 26 H212" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <path d="M204 19 L214 26 L204 33" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="224" width="164" height="52" rx="14" fill="#123246" stroke="#3b6273"/>
    <text x="306" y="32" text-anchor="middle" fill="#dff8f2" font-family="Segoe UI, Arial, sans-serif" font-size="17">Bridge / AUD1</text>
    <path d="M406 26 H456" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <path d="M448 19 L458 26 L448 33" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="468" width="150" height="52" rx="14" fill="#123246" stroke="#3b6273"/>
    <text x="543" y="32" text-anchor="middle" fill="#dff8f2" font-family="Segoe UI, Arial, sans-serif" font-size="17">Aliyun / Deepgram</text>
    <path d="M634 26 H684" stroke="#5eead4" stroke-width="3" stroke-linecap="round"/>
    <path d="M676 19 L686 26 L676 33" fill="none" stroke="#5eead4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="696" width="168" height="52" rx="14" fill="#123246" stroke="#3b6273"/>
    <text x="780" y="32" text-anchor="middle" fill="#dff8f2" font-family="Segoe UI, Arial, sans-serif" font-size="17">SendInput / Quartz</text>
  </g>
  <g transform="translate(1000 250)" filter="url(#glow)">
    <rect width="190" height="94" rx="18" fill="#0f2d3a" stroke="#5eead4" stroke-width="2"/>
    <rect x="16" y="18" width="158" height="8" rx="4" fill="#5eead4" opacity="0.45"/>
    <rect x="16" y="38" width="126" height="8" rx="4" fill="#7dd3fc" opacity="0.55"/>
    <rect x="16" y="58" width="146" height="8" rx="4" fill="#7dd3fc" opacity="0.35"/>
    <text x="16" y="86" fill="#bff7ef" font-family="Segoe UI, Arial, sans-serif" font-size="13">partial / final text</text>
  </g>
  <text x="1000" y="374" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">Python 3.10+ · local-first · no telemetry</text>
</svg>
