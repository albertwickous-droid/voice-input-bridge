<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Voice Input Bridge social preview</title>
  <desc id="desc">PCM audio from devices flows through a bridge to streaming ASR and then into Windows or macOS text fields.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.58" stop-color="#0e2b3c"/>
      <stop offset="1" stop-color="#123d43"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#7dd3fc"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="640" rx="0" fill="url(#bg)"/>
  <path d="M0 505 C220 425 360 575 610 485 S940 390 1280 505 V640 H0Z" fill="#081827" opacity="0.84"/>
  <circle cx="1120" cy="95" r="240" fill="none" stroke="#5eead4" stroke-width="1" opacity="0.16"/>
  <circle cx="1120" cy="95" r="180" fill="none" stroke="#7dd3fc" stroke-width="1" opacity="0.2"/>
  <g fill="#5eead4" opacity="0.85">
    <rect x="80" y="66" width="9" height="9" rx="2"/>
    <rect x="101" y="66" width="9" height="9" rx="2"/>
    <rect x="122" y="66" width="9" height="9" rx="2"/>
  </g>
  <text x="80" y="166" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="66" font-weight="700" letter-spacing="2">VOICE INPUT BRIDGE</text>
  <text x="82" y="230" fill="url(#accent)" font-family="Segoe UI, Arial, sans-serif" font-size="36" font-weight="600">PCM in. Partial and final text out.</text>
  <text x="82" y="278" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="24">Device-agnostic real-time dictation for Windows and macOS</text>

  <g transform="translate(82 345)">
    <rect width="232" height="116" rx="20" fill="#102c3e" stroke="#3b6273"/>
    <text x="24" y="35" fill="#8ee9da" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">DEVICE</text>
    <text x="24" y="68" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21">ESP32 / M5Stick</text>
    <text x="24" y="94" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">browser / phone / script</text>
  </g>
  <path d="M330 403 H402" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <path d="M390 391 L406 403 L390 415" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(424 345)">
    <rect width="254" height="116" rx="20" fill="#102c3e" stroke="#3b6273"/>
    <text x="24" y="35" fill="#8ee9da" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">BRIDGE</text>
    <text x="24" y="68" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21">WS / TCP / Serial</text>
    <text x="24" y="94" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">AUD1 PCM frames</text>
  </g>
  <path d="M694 403 H766" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <path d="M754 391 L770 403 L754 415" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(788 345)">
    <rect width="290" height="116" rx="20" fill="#102c3e" stroke="#3b6273"/>
    <text x="24" y="35" fill="#8ee9da" font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600">STREAMING ASR</text>
    <text x="24" y="68" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="21">Aliyun / Deepgram</text>
    <text x="24" y="94" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="15">pluggable providers</text>
  </g>
  <path d="M1094 403 H1150" stroke="#5eead4" stroke-width="4" stroke-linecap="round"/>
  <path d="M1138 391 L1154 403 L1138 415" fill="none" stroke="#5eead4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <g transform="translate(82 520)">
    <rect width="1116" height="70" rx="18" fill="#0c2231" stroke="#24475a"/>
    <text x="26" y="30" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">partial → diff → final</text>
    <text x="244" y="30" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">minimal text revisions</text>
    <text x="470" y="30" fill="#5eead4" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="600">foreground guard</text>
    <text x="650" y="30" fill="#cbd5e1" font-family="Segoe UI, Arial, sans-serif" font-size="17">Windows SendInput / macOS Quartz</text>
    <text x="26" y="54" fill="#94a3b8" font-family="Segoe UI, Arial, sans-serif" font-size="14">loopback by default · credentials from environment · no telemetry · MIT</text>
  </g>
  <g transform="translate(1150 96)" filter="url(#glow)">
    <rect width="10" height="10" rx="2" fill="#5eead4"/>
  </g>
</svg>
