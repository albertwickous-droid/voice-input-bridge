[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voice-input-bridge"
version = "0.1.0"
description = "Device-agnostic real-time speech-to-text bridge with cross-platform text injection."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Voice Input Bridge contributors" }]
keywords = ["speech-to-text", "dictation", "websocket", "serial", "esp32", "accessibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Utilities",
]
dependencies = [
  "websockets>=13.1,<16",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
aliyun = ["dashscope>=2.0.0"]
macos = ["pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'"]
all = [
  "pyserial>=3.5",
  "dashscope>=2.0.0",
  "pyobjc-framework-Quartz>=10.3; sys_platform == 'darwin'",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
  "setuptools>=77",
  "twine>=6.0",
  "wheel>=0.45",
]

[project.urls]
Homepage = "https://github.com/albertwickous-droid/voice-input-bridge"
Issues = "https://github.com/albertwickous-droid/voice-input-bridge/issues"

[project.scripts]
voicebridge = "voicebridge.cli:main"
vib = "voicebridge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = ["E501", "RUF001"]

[tool.pytest.ini_options]
addopts = "-ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
[tool.setuptools.package-data]
voicebridge = ["py.typed"]