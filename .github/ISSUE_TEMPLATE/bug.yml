name: Bug report
description: Report a reproducible non-security problem
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, Wi-Fi passwords, tokens, personal audio, or full transcripts.
        Security issues must use the private security advisory flow.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - Windows
        - macOS
        - Linux
        - ESP32 / M5 device
        - Browser
        - Other
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Configuration and command (sanitized)
      render: shell
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      placeholder: Use mock provider and null input when possible.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and sanitized logs
      render: text
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Doctor output
      description: Run voicebridge doctor --config ... --json and remove sensitive paths if needed.
      render: json
